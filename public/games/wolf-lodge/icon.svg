  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- the lodge -->
  <polygon points="40,250 256,110 472,250" fill="#3e4a36"/>
  <rect x="70" y="240" width="372" height="170" fill="#8a5a30"/>
